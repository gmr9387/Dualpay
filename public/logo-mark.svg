<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DualPay">
  <title>DualPay</title>
  <rect width="64" height="64" rx="14" fill="#1F4C37"/>
  <!-- two sides of a reimbursement: provider and payer -->
  <circle cx="26" cy="32" r="14" fill="#FFFFFF"/>
  <circle cx="38" cy="32" r="14" fill="#7FD1A8"/>
