<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DualPay — Claims Adjudication &amp; Denial Recovery</title>
    <meta name="description" content="DualPay multi-tenant claims adjudication, denial recovery, and revenue-integrity platform." />
    <meta name="author" content="DualPay" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Content-Security-Policy (and the other security headers) are set as
      real HTTP response headers in vercel.json, not here. frame-ancestors
      -- the directive that actually blocks clickjacking -- is explicitly
      excluded from meta-delivered CSP by spec, so it only takes effect as
      a real header; a <meta> CSP here would silently no-op that directive
      while also drifting out of sync with vercel.json's policy.
    -->

    <meta property="og:title" content="DualPay" />
    <meta property="og:description" content="Claims adjudication and denial recovery platform." />
    <meta property="og:type" content="website" />
    <!-- Relative URL: the production domain isn't fixed in this repo, and
         every major unfurler (Slack, iMessage, X, LinkedIn) resolves a
         relative og:image against the page's own origin. -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DualPay" />
    <meta name="twitter:description" content="Claims adjudication and denial recovery platform." />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
